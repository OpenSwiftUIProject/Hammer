name: Hammer
options:
  bundleIdPrefix: com.lyft
  deploymentTarget:
    iOS: "15.0"
    macOS: "12.0"
targets:
  Hammer:
    type: framework
    supportedDestinations: [iOS, macOS]
    sources: Sources/Hammer
    settings:
      ENABLE_TESTING_SEARCH_PATHS: true
    scheme:
      testTargets:
        - HammerTests
      coverageTargets: 
        - Hammer
      gatherCoverageData: true
  HammerTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: Tests/HammerTests
    settings:
      "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/TestHost.app/Contents/MacOS/TestHost"
    dependencies:
      - target: Hammer
      - target: TestHost
  TestHost:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: TestHost
        excludes:
          - LaunchScreen.storyboard
          - AppIcon.xcassets
      - path: TestHost/LaunchScreen.storyboard
        destinationFilters: [iOS]
      - path: TestHost/AppIcon.xcassets
        destinationFilters: [iOS]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "1.0"
      "INFOPLIST_FILE[sdk=macosx*]": ""
      "INFOPLIST_KEY_NSPrincipalClass[sdk=macosx*]": NSApplication
